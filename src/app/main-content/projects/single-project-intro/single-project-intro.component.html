<div>
    <div class="img-div">
        <img class="project-screenshot" src="{{singleproj.imgPath}}" alt="{{singleproj.altText}}" [ngStyle]="{'animation': singleproj.ihk ? 'moveup-and-down 1s infinite alternate': 'none'}">
        <img *ngIf="singleproj.ihk" id="ihk-sticker" src="./assets/design/03_portfolio/ihk-sticker.png" alt="featured project sticker" style="display: flex"> 
        <div class="shadow-layer"></div>
        <div class="project-details-button-white desktop" (click)="gotoDetailPage.emit(singleproj.projname)">
            {{'portfolio.btn' | translate}}
        </div>
    </div>
    <h6>{{singleproj.projname | translate}}</h6>
    <p>{{singleproj.desc | translate}}</p>
    <!-- #region Project details button in mobile view -->
    <div class="project-details-button-black mobile" (click)="gotoDetailPage.emit(singleproj.projname)">
        {{'portfolio.btn' | translate}}
    </div>
    <!-- #endregion -->
</div>
